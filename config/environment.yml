# Demo environment configuration.
# Single source of truth for environment-specific endpoints. Referenced by the
# Airflow DAGs (airflow/dags/) and docs/CICD_PROCESS.md.
# NO credentials in this file — secrets live in Airflow connections/variables
# and Kubernetes secrets in the `airflow` namespace.

git:
  provider: GitHub
  repository_url: https://github.com/muellermarco/sml-cicd-demo
  default_branch: main
  baseline_branch: baseline          # machine-maintained mirror of the upstream model source

atscale:
  development:
    host: dev.atscale-demo.com
    namespace: atscale-dev           # GKE cluster atscale-performance (europe-west1-c)
    purpose: developer sandboxes — feature-branch deploys, experimentation
  qa:
    host: qa.atscale-demo.com
    namespace: atscale-qa
    purpose: auto-deploy on merge to main; nightly regression vs Live
  live:
    host: atscale-mm.atscale-demo.com
    namespace: atscale
    purpose: tagged releases only (vX.Y), gated by manual sign-off

upstream:
  # Plays the role of the "converter output" in a migration scenario: the weekly
  # baseline_refresh DAG re-syncs this repo into the `baseline` branch and
  # opens a drift PR when it changed.
  model_source: https://github.com/muellermarco/sml-tpcds-snowflake

orchestration:
  airflow: http://airflow.atscale-demo.com:8080
  executor: LocalExecutor
  kubernetes:
    cluster: gke_atscale-sales-demo_europe-west1-c_atscale-performance
    namespace: airflow
  secrets:
    atscale-dev-api: "key `token` = AtScale API token for dev"
    atscale-qa-api: "key `token` = AtScale API token for qa"
    atscale-live-api: "key `token` = AtScale API token for live"
    github-token: "key `token` = GitHub PAT (repo scope) for statuses + machine PRs"
