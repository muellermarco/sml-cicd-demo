relationships:
  - unique_name: web_sales_Fulfilling_Warehouse
    from:
      dataset: web_sales
      join_columns:
        - WS_WAREHOUSE_SK
    to:
      dimension: Fulfilling Warehouse
      level: Fulfilling Warehouse
  - unique_name: web_sales_Promotions
    from:
      dataset: web_sales
      join_columns:
        - WS_PROMO_SK
    to:
      dimension: Promotions
      level: Promotions
  - unique_name: web_sales_Date_Dimension_Sold
    from:
      dataset: web_sales
      join_columns:
        - WS_SOLD_DATE_SK
    role_play: Sold {0}
    to:
      dimension: Date Dimension
      level: Time Dimension
  - unique_name: web_sales_Date_Dimension_Ship
    from:
      dataset: web_sales
      join_columns:
        - WS_SHIP_DATE_SK
    role_play: Ship {0}
    to:
      dimension: Date Dimension
      level: Time Dimension
  - unique_name: web_sales_Customer_Dimension
    from:
      dataset: web_sales
      join_columns:
        - WS_BILL_CUSTOMER_SK
    to:
      dimension: Customer Dimension
      level: Customer Number
  - unique_name: web_sales_Customer_Demographics
    from:
      dataset: web_sales
      join_columns:
        - WS_BILL_CDEMO_SK
    to:
      dimension: Customer Demographics
      level: Customer Demographics
  - unique_name: web_sales_Ship_Mode
    from:
      dataset: web_sales
      join_columns:
        - WS_SHIP_MODE_SK
    to:
      dimension: Ship Mode
      level: Ship Mode
  - unique_name: web_sales_Product_Dimension
    from:
      dataset: web_sales
      join_columns:
        - WS_ITEM_SK
    to:
      dimension: Product Dimension
      level: Product Dimension
  - unique_name: store_sales_Store_Dimension
    from:
      dataset: store_sales
      join_columns:
        - SS_STORE_SK
    to:
      dimension: Store Dimension
      level: Store Dimension
  - unique_name: store_sales_Promotions
    from:
      dataset: store_sales
      join_columns:
        - SS_PROMO_SK
    to:
      dimension: Promotions
      level: Promotions
  - unique_name: store_sales_Date_Dimension_Sold
    from:
      dataset: store_sales
      join_columns:
        - SS_SOLD_DATE_SK
    role_play: Sold {0}
    to:
      dimension: Date Dimension
      level: Time Dimension
  - unique_name: store_sales_Customer_Dimension
    from:
      dataset: store_sales
      join_columns:
        - SS_CUSTOMER_SK
    to:
      dimension: Customer Dimension
      level: Customer Number
  - unique_name: store_sales_Customer_Demographics
    from:
      dataset: store_sales
      join_columns:
        - SS_CDEMO_SK
    to:
      dimension: Customer Demographics
      level: Customer Demographics
  - unique_name: store_sales_Product_Dimension
    from:
      dataset: store_sales
      join_columns:
        - SS_ITEM_SK
    to:
      dimension: Product Dimension
      level: Product Dimension
